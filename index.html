<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John Paul Moreno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4f4f2;
    --muted: #b9b9b6;
    --line: #5a5a5a;
    --tile: #2e2e2e;
    --dim: .6;              /* 0 = background drawing at full strength, 1 = hidden */
    --pad: 58px;
    --gap: 22px;
    --font: "Poppins", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: #0a1020;
    color: var(--ink);
    font-family: var(--font);
    font-weight: 300;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* Backdrops: the hypercar drawing on About, a slow pulsing gradient everywhere else */
  body::before {
    content: "";
    position: fixed; inset: 0;
    z-index: -3;
    background: linear-gradient(120deg, #0a1020, #1b1544, #0b3243, #2d1233, #0a1020);
    background-size: 400% 400%;
    animation: drift 45s ease-in-out infinite;
    transition: opacity .8s ease;
  }
  .bg { position: fixed; inset: 0; z-index: -2; pointer-events: none; transition: opacity .8s ease; }
  .bg-glow {
    background:
      radial-gradient(60vmax 45vmax at 18% 22%, rgba(70,120,255,.38), transparent 70%),
      radial-gradient(55vmax 40vmax at 84% 78%, rgba(230,75,107,.30), transparent 70%);
    animation: pulse 9s ease-in-out infinite;
  }
  .bg-car {
    z-index: -1;
    opacity: 0;
    background:
      linear-gradient(rgba(24,24,24,var(--dim)), rgba(24,24,24,var(--dim))),
      url("images/hypercar-background.jpg") center / cover no-repeat;
  }
  body[data-view="about"] { background: #404040; }
  body[data-view="about"]::before, body[data-view="about"] .bg-glow { opacity: 0; animation: none; }
  body[data-view="about"] .bg-car { opacity: 1; }
  @keyframes drift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes pulse { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  /* ---------- Header ---------- */
  .site-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 34px var(--pad) 34px;
  }
  .site-name {
    font-size: 2.2rem;
    font-weight: 400;
    letter-spacing: -0.01em;
    text-decoration: none;
    line-height: 1.1;
  }
  .site-nav { display: flex; gap: 28px; }
  .site-nav a {
    text-decoration: none;
    font-size: 1.02rem;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }
  .site-nav a:hover { border-bottom-color: var(--line); }
  .site-nav a[aria-current="page"] { border-bottom-color: var(--ink); }
  .social { justify-self: end; display: flex; gap: 16px; }
  .social a { display: inline-flex; }
  .social svg { width: 22px; height: 22px; fill: var(--ink); }

  main { padding: 0 var(--pad) 90px; }

  /* ---------- Home grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--gap);
    margin: 8px 0 0;
    padding: 0;
    list-style: none;
  }
  .tile {
    position: relative;
    display: block;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--tile);
    text-decoration: none;
    color: #fff;
  }
  .tile img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .5s ease;
  }
  .tile:hover img, .tile:focus-visible img { transform: scale(1.04); }
  .tile .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 64px 22px 20px;
    background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0));
    font-size: 1.02rem;
    font-weight: 400;
    line-height: 1.35;
  }
  .tile .cap small {
    display: block;
    margin-top: 3px;
    font-size: .8rem;
    font-weight: 300;
    opacity: .85;
  }
  .tile.text-tile { color: var(--ink); display: flex; align-items: flex-end; }
  .tile.text-tile .cap { position: static; background: none; padding: 26px; font-size: 1.5rem; font-weight: 400; }
  .tile.text-tile .cap small { font-size: .85rem; color: var(--muted); opacity: 1; }
  .tile.text-tile:hover { background: #3a3a3a; }

  /* ---------- Project page ---------- */
  .project { max-width: 1100px; margin: 12px auto 0; }
  .back { display: inline-block; font-size: .92rem; color: var(--muted); text-decoration: none; margin-bottom: 26px; }
  .back:hover { color: var(--ink); }
  .project h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); font-weight: 400; line-height: 1.15; letter-spacing: -0.01em; margin: 0 0 14px; max-width: 22ch; }
  .meta { margin: 0 0 34px; color: var(--muted); font-size: 1rem; }
  .meta span { display: block; }
  /* One picture: a single square image. Two or more: a vertical timeline. */
  .single { margin: 0 0 44px; width: min(440px, 100%); }
  .single img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--tile); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .single figcaption { margin-top: 10px; font-size: .95rem; color: var(--muted); }

  .timeline {
    --spine: 96px;
    position: relative;
    display: grid;
    grid-template-columns: 1fr var(--spine) 1fr;
    margin: 0 0 56px;
    padding: 0;
    list-style: none;
  }
  .timeline::before {            /* the ruler: tick marks either side of the line */
    content: "";
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 30px; margin-left: -15px;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.38) 0 1px, transparent 1px 14px);
    -webkit-mask: linear-gradient(to right, transparent, #000 35%, #000 65%, transparent);
            mask: linear-gradient(to right, transparent, #000 35%, #000 65%, transparent);
  }
  .timeline::after {             /* the line */
    content: "";
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 2px; margin-left: -1px;
    background: rgba(255,255,255,.7);
  }
  .tl-item { position: relative; width: 100%; max-width: 400px; }
  .tl-item:nth-child(odd)  { grid-column: 1; justify-self: end;   --accent: #5b8cf0; }
  .tl-item:nth-child(even) { grid-column: 3; justify-self: start; --accent: #ec5b7a; }
  .tl-item:nth-child(n+2) { margin-top: -120px; }
  .tl-item::before {             /* connector from card to line */
    content: "";
    position: absolute; top: 18px; height: 2px; width: calc(var(--spine) / 2);
    background: rgba(255,255,255,.7);
  }
  .tl-item::after {              /* dot on the line */
    content: "";
    position: absolute; top: 12px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 4px rgba(255,255,255,.18);
  }
  .tl-item:nth-child(odd)::before  { left: 100%; }
  .tl-item:nth-child(odd)::after   { left: calc(100% + var(--spine) / 2 - 7px); }
  .tl-item:nth-child(even)::before { right: 100%; }
  .tl-item:nth-child(even)::after  { right: calc(100% + var(--spine) / 2 - 7px); }

  .tl-card {
    background: #28282c;
    box-shadow: 0 22px 46px rgba(0,0,0,.5);
    border-radius: 3px;
    overflow: hidden;
    transform: perspective(900px) rotateY(var(--tilt, 0deg));
    transition: transform .4s ease;
  }
  .tl-item:nth-child(odd)  .tl-card { --tilt: 4deg; }
  .tl-item:nth-child(even) .tl-card { --tilt: -4deg; }
  .tl-card:hover { transform: perspective(900px) rotateY(0deg); }
  .tl-label {
    display: block;
    padding: 6px 14px;
    background: #e6e6e8;
    color: var(--accent);
    font-size: .74rem;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .tl-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--tile); }
  .tl-text { padding: 12px 16px 16px; }
  .tl-text h3 { margin: 0; font-size: 1.15rem; font-weight: 500; line-height: 1.3; }
  .tl-text p { margin: 6px 0 0; font-size: .92rem; color: var(--muted); }

  .body { max-width: 680px; }
  .body p { margin: 0 0 18px; font-size: 1.05rem; }
  .body h2 { font-size: 1.05rem; font-weight: 500; margin: 34px 0 10px; }
  .body ul { margin: 0; padding-left: 1.1em; }
  .body li { margin-bottom: 12px; font-size: 1.05rem; }
  .proj-links { margin: 0; padding: 0; list-style: none; }
  .proj-links li { margin: 0 0 10px; }
  .proj-links a { display: inline-block; font-size: 1rem; padding: 8px 18px; border: 1px solid var(--ink); border-radius: 99px; text-decoration: none; }
  .proj-links a:hover { background: var(--ink); color: #0a1020; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; padding: 0; list-style: none; }
  .tags li { margin: 0; font-size: .85rem; border: 1px solid var(--line); border-radius: 99px; padding: 3px 14px; }
  .pager { display: flex; justify-content: space-between; gap: 20px; margin-top: 70px; padding-top: 22px; border-top: 1px solid var(--line); font-size: .95rem; }
  .pager a { text-decoration: none; max-width: 45%; }
  .pager a:hover { text-decoration: underline; }
  .pager .next { margin-left: auto; text-align: right; }
  .pager small { display: block; color: var(--muted); font-size: .8rem; }

  /* ---------- Resume + About ---------- */
  .page { max-width: 900px; margin: 12px auto 0; }
  .page h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 400; margin: 0 0 22px; }
  .page h2 { font-size: 1.05rem; font-weight: 500; margin: 40px 0 12px; }
  .page p { font-size: 1.05rem; margin: 0 0 14px; }
  .resume-frame { width: 100%; height: 88vh; border: 1px solid var(--line); background: var(--tile); }
  .dl { display: inline-block; margin: 0 0 22px; font-size: .98rem; }
  .about-top { display: grid; grid-template-columns: 200px 1fr; gap: 36px; align-items: start; }
  .portrait { width: 200px; height: 200px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; font-size: 2.6rem; font-weight: 300; overflow: hidden; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }
  .facts { margin: 0; padding: 0; list-style: none; }
  .facts li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 1rem; }
  .facts b { font-weight: 500; display: block; }
  .skill-row { display: grid; grid-template-columns: 150px 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 1rem; }
  .skill-row b { font-weight: 500; }
  .awards { margin: 0; padding-left: 1.1em; }
  .awards li { margin-bottom: 6px; font-size: 1rem; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1000px) {
    :root { --pad: 32px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    :root { --pad: 20px; --gap: 14px; }
    .site-header { grid-template-columns: 1fr auto; row-gap: 14px; padding-top: 24px; padding-bottom: 22px; }
    .site-name { font-size: 1.7rem; }
    .site-nav { grid-column: 1 / -1; grid-row: 2; gap: 22px; }
    .grid { grid-template-columns: 1fr; }
    .timeline { --spine: 40px; grid-template-columns: var(--spine) 1fr; }
    .timeline::before { left: calc(var(--spine) / 2); }
    .timeline::after  { left: calc(var(--spine) / 2); }
    .tl-item, .tl-item:nth-child(odd), .tl-item:nth-child(even) { grid-column: 2; justify-self: stretch; max-width: none; margin-top: 0; margin-bottom: 36px; }
    .tl-item:nth-child(odd)::before, .tl-item:nth-child(even)::before { left: calc(var(--spine) / -2); right: auto; width: calc(var(--spine) / 2); }
    .tl-item:nth-child(odd)::after, .tl-item:nth-child(even)::after { left: calc(var(--spine) / -2 - 7px); right: auto; }
    .tl-item .tl-card { transform: none; }
    .about-top { grid-template-columns: 1fr; }
    .skill-row { grid-template-columns: 1fr; gap: 2px; }
    .resume-frame { height: 70vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .tile img { transition: none; }
    .tile:hover img { transform: none; }
    body::before { animation: none; }
    .bg-glow { animation: none; opacity: .5; }
    .tl-card { transition: none; transform: none; }
  }
</style>
</head>
<body>

<div class="bg bg-glow" aria-hidden="true"></div>
<div class="bg bg-car" aria-hidden="true"></div>

<header class="site-header">
  <a class="site-name" href="#/" id="siteName"></a>
  <nav class="site-nav" aria-label="Main">
    <a href="#/" data-route="home">Portfolio</a>
    <a href="#/resume" data-route="resume">Résumé</a>
    <a href="#/about" data-route="about">About</a>
  </nav>
  <div class="social" id="social"></div>
</header>

<main id="app" tabindex="-1"></main>

<script src="content.js"></script>
<script>
(function () {
  var P = window.PORTFOLIO;
  var app = document.getElementById('app');

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  /* ---------- Header ---------- */
  document.getElementById('siteName').textContent = P.name;
  var social = document.getElementById('social');
  (P.links || []).forEach(function (l) {
    var a = el('a', { href: l.url, target: '_blank', rel: 'noopener', 'aria-label': l.label });
    if (/linkedin/i.test(l.label)) {
      a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11.5H3V9.75zm6.5 0h3.83v1.57h.05c.53-1 1.84-2.07 3.79-2.07 4.05 0 4.8 2.66 4.8 6.12v5.88h-4v-5.2c0-1.24-.02-2.83-1.73-2.83-1.73 0-2 1.35-2 2.74v5.29h-4V9.75z"/></svg>';
    } else {
      a.textContent = l.label;
    }
    social.appendChild(a);
  });

  /* ---------- Views ---------- */
  function home() {
    var ul = el('ul', { 'class': 'grid' });
    P.projects.forEach(function (p) {
      var cap = el('span', { 'class': 'cap' }, [document.createTextNode(p.title)]);
      var sub = [p.org, p.dates].filter(Boolean).join(', ');
      var a = el('a', { 'class': 'tile' + (p.image ? '' : ' text-tile'), href: '#/project/' + p.slug });
      if (p.image) {
        var img = el('img', { src: p.image, alt: (p.gallery && p.gallery[0] && p.gallery[0].alt) || p.title, loading: 'lazy' });
        img.style.objectPosition = p.imagePosition || '50% 50%';
        a.appendChild(img);
      }
      var small = el('small', { text: p.org });
      cap.appendChild(small);
      a.appendChild(cap);
      ul.appendChild(el('li', null, [a]));
    });
    return ul;
  }

  function project(slug) {
    var i = P.projects.findIndex(function (p) { return p.slug === slug; });
    if (i < 0) return el('div', { 'class': 'page' }, [el('h1', { text: 'Project not found' }), el('a', { href: '#/', text: 'Back to portfolio' })]);
    var p = P.projects[i];
    var wrap = el('article', { 'class': 'project' });
    wrap.appendChild(el('a', { 'class': 'back', href: '#/', text: '← All projects' }));
    wrap.appendChild(el('h1', { text: p.title }));
    var meta = el('p', { 'class': 'meta' });
    [p.role, p.org, p.place, p.dates].filter(Boolean).forEach(function (t) { meta.appendChild(el('span', { text: t })); });
    wrap.appendChild(meta);

    var pics = p.gallery || [];
    if (pics.length === 1) {
      var fig = el('figure', { 'class': 'single' }, [el('img', { src: pics[0].src, alt: pics[0].alt || '' })]);
      if (pics[0].caption) fig.appendChild(el('figcaption', { text: pics[0].caption }));
      wrap.appendChild(fig);
    } else if (pics.length > 1) {
      var tl = el('ol', { 'class': 'timeline' });
      pics.forEach(function (im, n) {
        var card = el('div', { 'class': 'tl-card' });
        card.appendChild(el('span', { 'class': 'tl-label', text: im.label || ('Photo ' + (n + 1)) }));
        card.appendChild(el('img', { src: im.src, alt: im.alt || '', loading: 'lazy' }));
        if (im.caption || im.text) {
          var tx = el('div', { 'class': 'tl-text' });
          if (im.caption) tx.appendChild(el('h3', { text: im.caption }));
          if (im.text) tx.appendChild(el('p', { text: im.text }));
          card.appendChild(tx);
        }
        var li = el('li', { 'class': 'tl-item' }, [card]);
        li.style.gridRow = String(n + 1);
        tl.appendChild(li);
      });
      wrap.appendChild(tl);
    }

    var body = el('div', { 'class': 'body' });
    if (p.intro) body.appendChild(el('p', { text: p.intro }));
    if (p.bullets && p.bullets.length) {
      body.appendChild(el('h2', { text: 'What I did' }));
      var ul = el('ul');
      p.bullets.forEach(function (b) { ul.appendChild(el('li', { text: b })); });
      body.appendChild(ul);
    }
    if (p.notes) {
      p.notes.split(/\n\s*\n/).forEach(function (para) { body.appendChild(el('p', { text: para })); });
    }
    if (p.links && p.links.length) {
      body.appendChild(el('h2', { text: 'Read more' }));
      var lk = el('ul', { 'class': 'proj-links' });
      p.links.forEach(function (l) {
        lk.appendChild(el('li', null, [el('a', { href: l.url, target: '_blank', rel: 'noopener', text: l.label })]));
      });
      body.appendChild(lk);
    }
    if (p.tags && p.tags.length) {
      body.appendChild(el('h2', { text: 'Tools and methods' }));
      var t = el('ul', { 'class': 'tags' });
      p.tags.forEach(function (x) { t.appendChild(el('li', { text: x })); });
      body.appendChild(t);
    }
    wrap.appendChild(body);

    var pager = el('nav', { 'class': 'pager', 'aria-label': 'More projects' });
    if (i > 0) {
      var pv = P.projects[i - 1];
      pager.appendChild(el('a', { 'class': 'prev', href: '#/project/' + pv.slug }, [el('small', { text: 'Previous' }), document.createTextNode(pv.title)]));
    }
    if (i < P.projects.length - 1) {
      var nx = P.projects[i + 1];
      pager.appendChild(el('a', { 'class': 'next', href: '#/project/' + nx.slug }, [el('small', { text: 'Next' }), document.createTextNode(nx.title)]));
    }
    wrap.appendChild(pager);
    return wrap;
  }

  function resume() {
    var w = el('section', { 'class': 'page' });
    w.appendChild(el('h1', { text: 'Résumé' }));
    if (P.resume) {
      w.appendChild(el('a', { 'class': 'dl', href: P.resume, download: '', text: 'Download PDF' }));
      w.appendChild(el('iframe', { 'class': 'resume-frame', src: P.resume, title: 'Résumé of ' + P.name }));
    }
    return w;
  }

  function about() {
    var w = el('section', { 'class': 'page' });
    w.appendChild(el('h1', { text: 'About' }));
    var portrait = el('div', { 'class': 'portrait' });
    if (P.photo) {
      var ph = el('img', { src: P.photo, alt: P.name });
      ph.onerror = function () { ph.remove(); portrait.textContent = P.initials; };
      portrait.appendChild(ph);
    } else portrait.textContent = P.initials;
    var facts = el('ul', { 'class': 'facts' });
    [['School', P.school], ['Location', P.location]].forEach(function (f) {
      if (f[1]) facts.appendChild(el('li', null, [el('b', { text: f[0] }), document.createTextNode(f[1])]));
    });
    if (P.email) {
      var mail = el('a', { href: 'mailto:' + P.email, text: P.email });
      facts.appendChild(el('li', null, [el('b', { text: 'Email' }), mail]));
    }
    var right = el('div', null, [el('p', { text: P.headline }), el('p', { text: P.about }), facts]);
    w.appendChild(el('div', { 'class': 'about-top' }, [portrait, right]));

    if (P.education) {
      w.appendChild(el('h2', { text: 'Education' }));
      w.appendChild(el('p', { text: P.education.school + ', ' + P.education.degree + ', ' + P.education.date }));
    }
    if (P.skills && P.skills.length) {
      w.appendChild(el('h2', { text: 'Skills' }));
      P.skills.forEach(function (s) {
        w.appendChild(el('div', { 'class': 'skill-row' }, [el('b', { text: s.group }), el('span', { text: s.items.join(', ') })]));
      });
    }
    if (P.awards && P.awards.length) {
      w.appendChild(el('h2', { text: 'Awards' }));
      var ul = el('ul', { 'class': 'awards' });
      P.awards.forEach(function (a) { ul.appendChild(el('li', { text: a })); });
      w.appendChild(ul);
    }
    return w;
  }

  /* ---------- Router ---------- */
  function route() {
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/');
    var view, key = 'home', title = P.name;
    if (parts[0] === 'project' && parts[1]) {
      view = project(parts[1]);
      var pr = P.projects.filter(function (p) { return p.slug === parts[1]; })[0];
      if (pr) title = pr.title + ' | ' + P.name;
    } else if (parts[0] === 'resume') { view = resume(); key = 'resume'; title = 'Résumé | ' + P.name; }
    else if (parts[0] === 'about') { view = about(); key = 'about'; title = 'About | ' + P.name; }
    else view = home();

    app.replaceChildren(view);
    document.body.setAttribute('data-view', key === 'about' ? 'about' : 'other');
    document.title = title;
    document.querySelectorAll('.site-nav a').forEach(function (a) {
      if (a.dataset.route === key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
